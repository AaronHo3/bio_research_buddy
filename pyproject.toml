[project]
name = "bio-research-copilot"
version = "0.1.0"
description = "Evidence-grounded biomedical literature assistant."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Aaron Ho" }]
dependencies = [
    "fastembed>=0.4",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# MedCPT, NCBI's PubMed-trained retrieval stack. Needs PyTorch, so it is opt-in:
#   uv sync --extra medcpt
medcpt = [
    "torch>=2.0",
    "transformers>=4.40",
]

# Hosted LLM synthesis. Optional: without it the CLI answers with the
# deterministic extractive provider, so the project needs no paid service to run.
#   uv sync --extra llm
llm = [
    "anthropic>=0.40",
]

[project.scripts]
bio-copilot = "bio_research_copilot.cli:main"

[dependency-groups]
dev = [
    "anthropic>=0.40",
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bio_research_copilot"]

# ---------------------------------------------------------------------------
# Quality tooling
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear: likely bugs
    "UP",  # pyupgrade: modern syntax
    "N",   # pep8-naming
    "SIM", # simplify
    "TID", # tidy imports (bans relative parent imports)
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["bio_research_copilot"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

# Optional dependencies (the medcpt extra) are not installed in the default
# environment, so their imports cannot be resolved here. The adapter defers those
# imports and converts a missing package into a typed error at runtime.
[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not live\""
markers = [
    "live: tests that call real external services (deselected by default)",
]
