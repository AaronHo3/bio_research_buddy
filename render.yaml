# Render blueprint. Keeping this in version control means what is running is
# reviewable, rather than clicked into a dashboard and forgotten.
#
# This uses Render's Python runtime rather than the Dockerfile. Both work; the
# native runtime has fewer moving parts for a first deployment and gives plainer
# build logs. The Dockerfile remains for hosts that require one.
#
# Values marked sync:false are never stored here. Render prompts for them once
# and keeps them as secrets.
services:
  - type: web
    name: bio-research-copilot
    runtime: python
    plan: free
    buildCommand: pip install uv==0.12.5 && uv sync --frozen --extra web --extra llm --no-dev
    startCommand: uv run uvicorn --factory bio_research_copilot.web.app:build_default_app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ANTHROPIC_API_KEY
        sync: false
      # About 5,700 tokens go on a question, counting planning and synthesis, so
      # this is roughly 35 questions a day before the demo falls back to the
      # extractive provider. Raise it only as far as you are willing to pay.
      - key: DEMO_DAILY_TOKENS
        value: "200000"
      - key: LLM_MODEL
        value: claude-sonnet-5
      - key: PLANNER_MODEL
        value: claude-haiku-4-5-20251001
      # NCBI asks clients to identify themselves. Use a real address.
      - key: NCBI_TOOL_NAME
        value: bio-research-copilot
      - key: NCBI_CONTACT_EMAIL
        sync: false
      # Optional: raises the NCBI rate limit from 3 to 10 requests a second.
      - key: NCBI_API_KEY
        sync: false
